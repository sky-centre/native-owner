name: EAS Update (OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel tujuan update"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: "Pesan update (opsional)"
        required: false
        default: "Update dari GitHub Actions"

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish update
        run: eas update --channel ${{ inputs.channel || 'preview' }} --message "${{ inputs.message || github.event.head_commit.message || 'Update dari push ke main' }}" --non-interactive
