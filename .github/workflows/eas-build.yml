name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build Android via EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Regenerate lock file if out of sync
        run: |
          rm -f package-lock.json
          npm install

      - name: Commit updated lock file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate package-lock.json [skip ci]"
            git push
          else
            echo "Lock file already up to date, nothing to commit."
          fi

      - name: Run EAS Build
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --no-wait
